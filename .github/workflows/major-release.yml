name: Move Major Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'vX.Y.Z'
        type: string
        required: true
  release:
    types: [created]

permissions: {}

jobs:
  movetag:
    runs-on: ubuntu-slim
    permissions:
      contents: write # moves the major version tag

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The next step pushes the moved major version tag.
        persist-credentials: true

    - name: Get major version num and update tag
      shell: bash
      env:
        PROVIDED_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "${PROVIDED_TAG}" ]; then
          VERSION="${PROVIDED_TAG}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "Using version ${VERSION}"
        MAJOR=${VERSION%%.*}
        git config --global user.name 'Release Bot'
        git config --global user.email 'release-bot@firebolt.io'
        git tag -fa "${MAJOR}" -m "Update major version tag"
        git push origin "${MAJOR}" --force
